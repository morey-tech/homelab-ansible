---
# Stage 1 of 2: Create cluster record, configure DNS/DHCP, and download Discovery ISO.
# After this playbook completes, write the ISO to USB and boot each bare-metal node.
# Then run baremetal-ocp-install.yml to wait for host discovery and install the cluster.
- name: Prepare bare-metal OCP cluster
  hosts: "{{ baremetal_cluster | default('ocp-mgmt.rh-lab.morey.tech') }}"
  gather_facts: false  # Hosts aren't available, since this playbook creates them.

  vars:
    recreate: false
    discovery_iso_host: localhost
    # The workspace is bind-mounted by the devcontainer, so files here are
    # directly accessible from the host laptop. The repository ignores var/.
    discovery_iso_directory: "{{ playbook_dir }}/../../var"

  pre_tasks:
    - name: Validate the bare-metal inventory
      ansible.builtin.import_tasks: tasks/baremetal-validate.yml
      tags: always

    - name: Build static network configuration from each node's inventory
      ansible.builtin.set_fact:
        static_network_config: "{{ lookup('template', 'baremetal-static-network.json.j2') | from_json }}"
      when: configure_baremetal_hosts | default(false) | bool
      tags: always

  tasks:
    - name: Assisted Installer
      tags: assisted_installer
      block:
        - name: Get a list of clusters  # noqa: run-once[task]
          rhpds.assisted_installer.list_clusters:
            offline_token: "{{ rh_console_offline_token }}"
          register: listclusters
          run_once: true

        - name: Delete Existing Assisted Installers (When Recreate)
          rhpds.assisted_installer.delete_cluster:
            cluster_id: "{{ item.id }}"
            offline_token: "{{ rh_console_offline_token }}"
            # cancel: true  # This errors if cluster is not in progress.
          loop: "{{ listclusters.result | selectattr('name', 'equalto', cluster_name) | list }}"
          loop_control:
            label: "{{ item.name }}, {{ item.id }}"
          when: recreate | bool

        - name: Delete Existing Discovery ISOs
          ansible.builtin.file:
            path: "{{ discovery_iso_directory }}/{{ cluster_name }}-{{ item.id }}-discovery.iso"
            state: absent
          loop: "{{ listclusters.result | selectattr('name', 'equalto', cluster_name) | list }}"
          loop_control:
            label: "{{ item.name }}, {{ item.id }}"
          when: recreate | bool
          delegate_to: "{{ discovery_iso_host }}"

        - name: Require an unambiguous existing cluster with the requested topology
          ansible.builtin.assert:
            that:
              - existing_clusters | length <= 1
              - existing_clusters | length == 0 or existing_clusters[0].high_availability_mode == ('Full' if groups[nodes_group] | length >= 3 else 'None')
              - existing_clusters | length == 0 or existing_clusters[0].schedulable_masters == (schedulable_masters | default(false) | bool)
              - existing_clusters | length == 0 or existing_clusters[0].openshift_version is match('^' ~ (cluster_version | regex_escape) ~ '(\\.|$)')
            fail_msg: The existing installer differs from this inventory. Review it and use -e recreate=true to replace its record.
          vars:
            existing_clusters: "{{ listclusters.result | selectattr('name', 'equalto', cluster_name) | list }}"
          when: not recreate | bool

        - name: Set cluster_id to existing installer
          ansible.builtin.set_fact:
            # Last should be the most recent one.
            cluster_id: "{{ listclusters.result | selectattr('name', 'equalto', cluster_name) | map(attribute='id') | last }}"
          when: listclusters.result | selectattr('name', 'equalto', cluster_name) | list | length > 0

        - name: Create Assisted Installer Cluster
          rhpds.assisted_installer.create_cluster:
            name: "{{ cluster_name }}"
            openshift_version: "{{ cluster_version }}"
            base_dns_domain: "{{ cluster_dns_zone }}"
            offline_token: "{{ rh_console_offline_token }}"
            pull_secret: "{{ rh_console_pull_secret | to_json }}"
            # If node group is less than 3, set high availability mode to None for SNO.
            high_availability_mode: "{{ 'Full' if groups[nodes_group] | length >= 3 else 'None' }}"
            schedulable_masters: "{{ schedulable_masters | default(omit) }}"
            cluster_network_cidr: "{{ cluster_network_cidr }}"
            cluster_network_host_prefix: "{{ cluster_network_host_prefix }}"
            service_networks: "{{ service_networks }}"
            machine_networks: "{{ machine_networks }}"
            api_vips: "{{ api_vips if groups[nodes_group] | length >= 3 else [] }}"
            ingress_vips: "{{ ingress_vips if groups[nodes_group] | length >= 3 else [] }}"
            ssh_public_key: "{{ ssh_authorized_keys }}"
          register: newcluster
          when: not cluster_id is defined or recreate | bool

        - name: Set cluster_id to new installer
          ansible.builtin.set_fact:
            cluster_id: "{{ newcluster.result.id }}"
          when: not cluster_id is defined or recreate | bool

        # debug cluster_id
        - name: Print selected cluster_id
          ansible.builtin.debug:
            msg: "{{ cluster_id }}"

    - name: Create DHCP static mapping
      pfsensible.core.pfsense_dhcp_static:
        netif: opt3  # rh_lab
        hostname: "{{ hostvars[item].inventory_hostname_short }}"
        macaddr: "{{ hostvars[item].mac_address }}"
        ipaddr: "{{ hostvars[item].ip_address }}"
        ddnsdomainkeyalgorithm: "hmac-md5"  # fixes diff.
        state: present
      delegate_to: pfsense.home.morey.tech
      throttle: 1
      loop: "{{ groups[nodes_group] }}"
      tags: dhcp

    - name: Configure OCP DNS on the Technitium primary
      ansible.builtin.import_tasks: tasks/technitium-dns.yml
      tags: dns

    - name: Create Discovery ISO
      rhpds.assisted_installer.create_infra_env:
        name: "{{ cluster_name }}-infra-env"
        image_type: "{{ image_type }}"
        cluster_id: "{{ cluster_id }}"
        ssh_authorized_key: "{{ ssh_authorized_keys }}"
        offline_token: "{{ rh_console_offline_token }}"
        pull_secret: "{{ rh_console_pull_secret | to_json }}"
        openshift_version: "{{ cluster_version }}"
        static_network_config: "{{ static_network_config }}"
      register: newinfraenv

    - name: Create the discovery ISO directory
      ansible.builtin.file:
        path: "{{ discovery_iso_directory }}"
        state: directory
        mode: '0700'
      delegate_to: "{{ discovery_iso_host }}"

    - name: Download Discovery ISO
      ansible.builtin.get_url:
        url: "{{ newinfraenv.result.download_url }}"
        dest: "{{ discovery_iso_directory }}/{{ cluster_name }}-{{ cluster_id }}-discovery.iso"
        mode: '0600'
        force: true
      delegate_to: "{{ discovery_iso_host }}"

    - name: Print next steps
      ansible.builtin.debug:
        msg:
          - "Assisted Installer: https://console.redhat.com/openshift/assisted-installer/clusters/{{ cluster_id }}"
          - "ISO downloaded to {{ discovery_iso_host }}: {{ discovery_iso_directory }}/{{ cluster_name }}-{{ cluster_id }}-discovery.iso"
          - "Write the ISO to USB and boot each node. Record the intended OS disk IDs in inventory before running baremetal-ocp-install.yml."
