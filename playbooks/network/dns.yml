---
- name: Provision DNS nodes
  hosts: dns
  serial: 1
  order: reverse_sorted
  any_errors_fatal: true
  become: true

  tasks:
    - name: Validate the node provisioning platform
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'RedHat'
        fail_msg: >-
          DNS provisioning currently supports Fedora/RHEL package names;
          add an OS-specific package setup before enabling a Debian-based Pi.
      tags: always

    - name: Require the node network profile settings
      ansible.builtin.assert:
        that:
          - dns_parent_interface is defined
          - dns_native_connection is defined
        fail_msg: Set the interface and NetworkManager profile in this node's host_vars before provisioning.
      tags: network_addresses

    - name: Set the DNS node hostname
      ansible.builtin.hostname:
        name: "{{ dns_hostname }}"
      tags: network_addresses

    # The baseline explicitly requires upgrading all installed packages.
    - name: Refresh package metadata and upgrade all packages # noqa: package-latest
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install DNS baseline packages
      ansible.builtin.dnf:
        name:
          - vim-enhanced
          - git
          - ansible-core
          - podman
          - firewalld
          - tcpdump
          - bind-utils
        state: present

    - name: Install the guest agent on virtual DNS nodes
      ansible.builtin.dnf:
        name: qemu-guest-agent
        state: present
      when: dns_is_vm | default(false) | bool

    - name: Enable and start baseline services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - qemu-guest-agent
        - firewalld
      when: item != 'qemu-guest-agent' or dns_is_vm | default(false) | bool

    # https://blog.technitium.com/2017/11/running-dns-server-on-ubuntu-linux.html
    - name: Install Technitium DNS Server dependencies
      ansible.builtin.dnf:
        name:
          - aspnetcore-runtime-10.0
          - libicu
          - tar
          - gzip
          - python3-firewall
        state: present

    - name: Configure native and tagged DNS addresses
      ansible.builtin.import_tasks: tasks/network-addresses.yml
      tags: network_addresses

    - name: Create Technitium DNS Server group
      ansible.builtin.group:
        name: dns-server
        system: true

    - name: Create Technitium DNS Server user
      ansible.builtin.user:
        name: dns-server
        group: dns-server
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create Technitium DNS Server directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: dns-server
        group: dns-server
        mode: "0750"
      loop:
        - /opt/technitium/dns
        - /etc/dns
        - /var/log/technitium/dns

    - name: Install or upgrade the pinned Technitium version
      ansible.builtin.import_tasks: tasks/technitium-install.yml
      tags: technitium_upgrade

    - name: Install Technitium DNS Server systemd unit
      ansible.builtin.copy:
        src: /opt/technitium/dns/systemd.service
        dest: /etc/systemd/system/dns.service
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart Technitium DNS Server

    - name: Gather service facts
      ansible.builtin.service_facts:

    # Keep systemd-resolved available for host lookups, while freeing port 53.
    - name: Configure systemd-resolved to use upstream resolvers without a stub listener
      when:
        - "'systemd-resolved.service' in ansible_facts.services"
        - ansible_facts.services['systemd-resolved.service'].state == 'running'
      block:
        - name: Create systemd-resolved configuration directory
          ansible.builtin.file:
            path: /etc/systemd/resolved.conf.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Disable systemd-resolved stub listener
          ansible.builtin.copy:
            dest: /etc/systemd/resolved.conf.d/technitium.conf
            content: |
              [Resolve]
              DNSStubListener=no
            owner: root
            group: root
            mode: "0644"
          notify: Restart systemd-resolved

        - name: Inspect host resolver configuration
          ansible.builtin.stat:
            path: /etc/resolv.conf
            follow: false
          register: dns_resolv_conf

        - name: Point host resolver at systemd-resolved upstream resolver list
          ansible.builtin.file:
            src: /run/systemd/resolve/resolv.conf
            dest: /etc/resolv.conf
            state: link
            force: true
          when:
            - dns_resolv_conf.stat.islnk | default(false)
            - dns_resolv_conf.stat.lnk_source == '/run/systemd/resolve/stub-resolv.conf'

    - name: Apply resolver and DNS service changes
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Technitium DNS Server
      ansible.builtin.systemd_service:
        name: dns.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Allow DNS and Technitium web console through the configured firewall zone
      ansible.posix.firewalld:
        zone: "{{ dns_firewall_zone | default(omit) }}"
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 53/udp
        - 53/tcp
        - 5380/tcp

    - name: Wait for Technitium web console
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 5380
        timeout: 60
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

    - name: Wait for Technitium DNS TCP listener
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 53
        timeout: 60
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

  handlers:
    - name: Restart systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved.service
        state: restarted

    - name: Restart Technitium DNS Server
      ansible.builtin.systemd_service:
        name: dns.service
        state: restarted
        daemon_reload: true

- name: Configure shared Technitium settings through the primary node
  hosts: dns_primary
  become: true
  any_errors_fatal: true
  gather_facts: false

  pre_tasks:
    - name: Require exactly one designated API configuration host
      ansible.builtin.assert:
        that: groups['dns_primary'] | length == 1
        fail_msg: The dns_primary inventory group must contain exactly one host.
      tags: always

  tasks:
    - name: Load and validate Technitium API credentials
      ansible.builtin.import_tasks: tasks/technitium-api-auth.yml
      tags:
        - technitium_config
        - technitium_query_logs
        - technitium_exceptions
        - technitium_allowed_test
        - technitium_test
        - technitium_forwarding
        - technitium_api_auth

    - name: Configure Technitium upstream DNS
      ansible.builtin.import_tasks: tasks/technitium-forwarders.yml
      tags: technitium_config

    - name: Configure searchable Technitium query logs
      ansible.builtin.import_tasks: tasks/technitium-query-logs.yml
      tags: [technitium_config, technitium_query_logs]

    - name: Configure Technitium block lists
      ansible.builtin.import_tasks: tasks/technitium-blocklists.yml
      tags: technitium_config

    - name: Configure private Technitium blocking exceptions
      ansible.builtin.import_tasks: tasks/technitium-allowed-domains.yml
      tags:
        - technitium_config
        - technitium_exceptions

    - name: Verify private Technitium blocking exceptions
      ansible.builtin.import_tasks: tasks/technitium-test-allowed-domains.yml
      tags:
        - technitium_config
        - technitium_exceptions
        - technitium_test
        - technitium_allowed_test

    - name: Configure Technitium conditional forwarding after exception verification
      ansible.builtin.include_tasks:
        file: tasks/technitium-conditional-forwarder.yml
        apply:
          tags: [technitium_config, technitium_forwarding]
      loop: "{{ technitium_conditional_forwarders }}"
      loop_control:
        loop_var: technitium_conditional_zone
      tags: [technitium_config, technitium_forwarding]

- name: Verify DNS service on each provisioned node
  hosts: dns
  become: true
  gather_facts: false

  tasks:
    - name: Verify Technitium resolves a public name over UDP and TCP
      ansible.builtin.command:
        argv:
          - dig
          - "@{{ ansible_host }}"
          - "{{ technitium_test_domain | default('example.com') }}"
          - A
          - "{{ item }}"
          - +time=5
          - +tries=1
          - +noall
          - +comments
          - +answer
      loop:
        - +notcp
        - +tcp
      register: technitium_dns_test
      changed_when: false
      # dig can return exit code 0 for SERVFAIL or NXDOMAIN.
      until:
        - technitium_dns_test.rc == 0
        - "'status: NOERROR' in technitium_dns_test.stdout"
        - technitium_dns_test.stdout is search('\\sIN\\s+A\\s+[0-9.]+')
      retries: 3
      delay: 2
      when: not ansible_check_mode
      tags:
        - technitium_config
        - technitium_test

    - name: Verify Technitium blocks a listed domain over UDP and TCP
      ansible.builtin.command:
        argv:
          - dig
          - "@{{ ansible_host }}"
          - "{{ technitium_blocklist_test_domain | default('doubleclick.net') }}"
          - A
          - "{{ item }}"
          - +edns=0
          - +time=5
          - +tries=1
          - +noall
          - +comments
          - +answer
          - +additional
      loop:
        - +notcp
        - +tcp
      register: technitium_blocklist_test
      changed_when: false
      # Require Technitium's own block-list attribution, not just NXDOMAIN.
      until:
        - technitium_blocklist_test.rc == 0
        - "'EDE: 15 (Blocked)' in technitium_blocklist_test.stdout"
        - "'source=block-list-zone; blockListUrl=' in technitium_blocklist_test.stdout"
      retries: "{{ technitium_blocklist_test_retries | default(30) }}"
      delay: 5
      when:
        - not ansible_check_mode
        - technitium_blocking_enabled | bool
        - technitium_blocklist_urls | length > 0
      tags:
        - technitium_config
        - technitium_test
        - technitium_blocklist_test
