---
- name: Read all NetworkManager profile names
  ansible.builtin.command: nmcli -g NAME connection show
  register: dns_all_profiles
  changed_when: false
  check_mode: false

- name: Configure the tagged VLAN profile
  community.general.nmcli:
    conn_name: "{{ dns_vlan.connection }}"
    ifname: "{{ dns_parent_interface }}.{{ dns_vlan.id }}"
    type: vlan
    vlanid: "{{ dns_vlan.id }}"
    vlandev: "{{ dns_parent_interface }}"
    ip4: ["{{ dns_vlan.address }}"]
    method4: manual
    method6: disabled
    never_default4: true
    dns4_ignore_auto: true
    zone: "{{ dns_vlan.zone }}"
    # New profiles remain down until duplicate-address detection is configured.
    autoconnect: "{{ dns_vlan.connection in dns_all_profiles.stdout_lines }}"
    state: present
  register: dns_vlan_profile

- name: Read duplicate-address detection setting
  ansible.builtin.command:
    argv: [nmcli, -g, ipv4.dad-timeout, connection, show, "{{ dns_vlan.connection }}"]
  register: dns_vlan_dad
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or dns_vlan.connection in dns_all_profiles.stdout_lines

- name: Enable duplicate-address detection before VLAN activation
  ansible.builtin.command:
    argv: [nmcli, connection, modify, "{{ dns_vlan.connection }}", ipv4.dad-timeout, "3000"]
  changed_when: true
  when:
    - not ansible_check_mode
    - dns_vlan_dad.stdout != '3000'

- name: Enable autoconnect for a newly created VLAN
  ansible.builtin.command:
    argv: [nmcli, connection, modify, "{{ dns_vlan.connection }}", connection.autoconnect, "yes"]
  changed_when: true
  when:
    - dns_vlan.connection not in dns_all_profiles.stdout_lines
    - not ansible_check_mode

- name: Activate or reapply the VLAN profile
  community.general.nmcli:
    conn_name: "{{ dns_vlan.connection }}"
    state: up
    conn_reload: "{{ dns_vlan_profile.changed }}"
  when:
    - not ansible_check_mode

- name: Read live IPv4 addresses after VLAN configuration
  ansible.builtin.command: ip -4 -o address show
  register: dns_vlan_live
  changed_when: false
  when: not ansible_check_mode

- name: Verify the VLAN address is active
  ansible.builtin.assert:
    that:
      - dns_vlan.address in dns_vlan_live.stdout
  when: not ansible_check_mode
