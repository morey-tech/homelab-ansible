---
- name: Back up NetworkManager connection profiles before managing DNS addresses
  block:
    - name: Create protected network backup directory
      ansible.builtin.file:
        path: /var/backups/dns
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Save original NetworkManager profiles once
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - /var/backups/dns/before-dns-vlans.tar.gz
          - -C
          - /etc/NetworkManager
          - system-connections
        creates: /var/backups/dns/before-dns-vlans.tar.gz

- name: Ensure dedicated VLAN firewall zones exist
  ansible.posix.firewalld:
    zone: "{{ item.zone }}"
    state: present
    permanent: true
  loop: "{{ dns_vlans + [{'zone': dns_firewall_zone}] }}"
  register: dns_zone_creation

# Runtime zones must exist before the following immediate port rules are applied.
- name: Load newly created firewall zones # noqa: no-handler
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
  when: dns_zone_creation is changed

- name: Allow SSH in the native management zone before assigning the interface
  ansible.posix.firewalld:
    zone: "{{ dns_firewall_zone }}"
    service: ssh
    state: enabled
    permanent: true
    immediate: true
  when: not ansible_check_mode or not dns_zone_creation.changed

- name: Allow DNS in the tagged VLAN zones
  ansible.posix.firewalld:
    zone: "{{ item.zone }}"
    service: dns
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ dns_vlans }}"
  when: not ansible_check_mode or not dns_zone_creation.changed

- name: Require management access through the intended static address
  ansible.builtin.assert:
    that:
      - ansible_host == dns_native_address.split('/')[0]
    fail_msg: Provision the native static address during VM installation and connect through it before running DNS networking tasks.

- name: Read live native IPv4 addresses
  ansible.builtin.command:
    argv: [ip, -j, -4, address, show, dev, "{{ dns_parent_interface }}"]
  register: dns_native_live
  changed_when: false
  check_mode: false

- name: Configure static native IPv4 management without DHCP
  community.general.nmcli:
    conn_name: "{{ dns_native_connection }}"
    ifname: "{{ dns_parent_interface }}"
    type: ethernet
    method4: manual
    ip4: ["{{ dns_native_address }}"]
    gw4: "{{ dns_native_gateway }}"
    dns4: "{{ dns_native_resolvers }}"
    dns4_ignore_auto: true
    zone: "{{ dns_firewall_zone }}"
    autoconnect: true
    state: present
  register: dns_native_profile

- name: Reapply static management addressing without disconnecting the link
  ansible.builtin.command:
    argv: [nmcli, device, reapply, "{{ dns_parent_interface }}"]
  changed_when: true
  when: >-
    dns_native_profile.changed or
    ((dns_native_live.stdout | from_json)[0].addr_info | map(attribute='local') | list)
      != [dns_native_address.split('/')[0]]

- name: Configure each tagged VLAN
  ansible.builtin.include_tasks:
    file: network-vlan.yml
    apply:
      tags: network_addresses
  loop: "{{ dns_vlans }}"
  loop_control:
    loop_var: dns_vlan

- name: Read the final native IPv4 addresses
  ansible.builtin.command:
    argv: [ip, -j, -4, address, show, dev, "{{ dns_parent_interface }}"]
  register: dns_native_final
  changed_when: false
  when: not ansible_check_mode

- name: Verify the native interface has only its intended static IPv4 address
  ansible.builtin.assert:
    that:
      - >-
        ((dns_native_final.stdout | from_json)[0].addr_info | map(attribute='local') | list)
        == [dns_native_address.split('/')[0]]
  when: not ansible_check_mode
