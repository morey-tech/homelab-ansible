---
- name: Migrate live BIND OCP zones to Technitium
  hosts: dns_primary
  gather_facts: false
  become: true
  any_errors_fatal: true

  pre_tasks:
    - name: Require exactly one primary and an explicit migration zone list
      ansible.builtin.assert:
        that:
          - groups['dns_primary'] | length == 1
          - technitium_bind_migration_zones | length > 0
          - technitium_bind_migration_source in hostvars

    # Read ALL source zones before any writes; an incomplete export aborts migration.
    - name: Read and validate the live source zones without changing BIND
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', 'files/read-bind-zone.py') }}"
          - "{{ item }}"
          - "{{ hostvars[technitium_bind_migration_source].ansible_host }}"
          - "{{ hostvars[inventory_hostname].technitium_ocp_nameserver_address }}"
      delegate_to: "{{ technitium_bind_migration_source }}"
      loop: "{{ technitium_bind_migration_zones }}"
      register: bind_zone_exports
      changed_when: false
      check_mode: false
      no_log: true

    - name: Create a protected directory for original BIND exports
      ansible.builtin.file:
        path: /var/backups/technitium/bind-migration
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: not ansible_check_mode

    - name: Preserve original source zones on the destination
      ansible.builtin.copy:
        content: "{{ (item.stdout | from_json).source_zone_file }}"
        dest: "/var/backups/technitium/bind-migration/{{ (item.stdout | from_json).zone }}.zone"
        owner: root
        group: root
        mode: "0600"
        force: false
      loop: "{{ bind_zone_exports.results }}"
      no_log: true
      diff: false
      when: not ansible_check_mode

  tasks:
    - name: Import and verify each exported zone through the supported API
      ansible.builtin.include_role:
        name: technitium_zone
      vars:
        technitium_zone_name: "{{ (migration_zone.stdout | from_json).zone }}"
        technitium_zone_records: "{{ (migration_zone.stdout | from_json).records }}"
      loop: "{{ bind_zone_exports.results }}"
      loop_control:
        loop_var: migration_zone
        label: "{{ migration_zone.item }}"
      no_log: true
