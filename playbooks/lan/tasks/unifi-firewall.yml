---
- name: Preserve SSH and allow the UniFi OS console
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop:
    - "{{ ansible_port | default(22) }}"
    - "{{ unifi_os_web_port }}"

- name: Deny unsolicited incoming traffic by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow outgoing downloads and name resolution by default
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow UniFi device communication
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    insert: 1
  loop: "{{ unifi_device_ports }}"

- name: Enable the firewall
  community.general.ufw:
    state: enabled
