---
# Enable only after AdGuard at 192.168.3.53 has been shut down.
network_services_cutover_enabled: false
network_services_hostname: "network-services"
network_services_parent_interface: enp1s0
network_services_native_connection: Wired connection 1
network_services_native_address: 192.168.1.53/24
network_services_vlans:
  - id: 3
    connection: LAB
    address: 192.168.3.53/24
    zone: ns-vlan3
    enabled: "{{ network_services_cutover_enabled | bool }}"
  - id: 6
    connection: RH_LAB
    address: 192.168.6.53/24
    zone: ns-vlan6
    enabled: true
  - id: 20
    connection: IOT
    address: 192.168.20.53/24
    zone: ns-vlan20
    enabled: true

technitium_version: "15.5"
technitium_archive_url: https://download.technitium.com/dns/DnsServerPortable.tar.gz
technitium_archive_checksum: sha256:207c75ecaf7a31e6a1a0d6fd358f4efcb0f7a3f2d2dd17671c71c06fdf75773d

# Unfiltered Cloudflare DNS over TLS. Addresses avoid a bootstrap DNS lookup.
technitium_forwarders:
  - "cloudflare-dns.com (1.1.1.1:853)"
  - "cloudflare-dns.com (1.0.0.1:853)"
technitium_forwarder_protocol: Tls

technitium_query_log_settings:
  enableLogging: true
  maxLogDays: 7
  maxLogRecords: 10000

# Forward these local suffixes (including subdomains) to the LAN resolver.
technitium_conditional_forwarders:
  - zone: home.morey.tech
    forwarder: 192.168.1.1
  - zone: rh-lab.morey.tech
    forwarder: 192.168.1.1
  - zone: lab.morey.tech
    forwarder: 192.168.1.1
  - zone: iot.morey.tech
    forwarder: 192.168.1.1
# Environment/AAP injection takes precedence over the encrypted credential file.
technitium_api_token: >-
  {{ lookup('ansible.builtin.env', 'TECHNITIUM_API_TOKEN')
     | default(technitium_credentials.technitium_api_token | default(''), true) }}
technitium_api_bootstrap_interactive: true

# Technitium downloads and refreshes these lists itself.
technitium_blocking_enabled: true
technitium_blocklist_update_interval_hours: 24
technitium_blocklist_urls:
  # The Big List of Hacked Malware Web Sites
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_9.txt
  # uBlock filters - Badware risks
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_50.txt
  # Phishing Army
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_18.txt
  # NoCoin
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_8.txt
  # 1Hosts Lite
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_24.txt
  # HaGeZi Most Abused TLDs (AdGuard rule compatibility is limited)
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_56.txt
  # Phishing URL Blocklist
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_30.txt
  # AdGuard DNS filter
  - https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
